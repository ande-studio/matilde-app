name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (content, route engine, core, UI)
        run: npm test
      - name: Build and verify dist (no third parties, CSP, budget)
        run: npm run build
      - name: Production channel must only carry approved content
        run: CONTENT_CHANNEL=production npm run content
